[project]
name = "claude-code-setup"
version = "0.1.0"
description = "Claude Code environment bootstrap: MCP server registration, tool checks, Bifrost bring-up"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
setup = "claude_code_setup.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: live tests that hit real MCP servers/subprocesses (deselect with -m 'not integration')",
]
addopts = "--dist=loadgroup"
